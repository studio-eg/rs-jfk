  - generic [ref=f16e21]:
    - heading "Berufsorientierung" [level=2] [ref=f16e23]
    - generic [ref=f16e25]:
      - paragraph:
        - generic [ref=f16e26]: "\"In den Schulen ist die Berufs- und Studienorientierung ebenso wie in der Politik und der Wirtschaft ein wichtiges Thema. Jugendliche stehen in vielerlei Hinsicht, z.B. durch den sich rasant wandelnden Arbeitsmarkt, vor immer neuen Herausforderungen. Schülerinnen und Schüler sind gefordert, vorhandene berufliche Möglichkeiten an ihren Fähigkeiten und Interessen zu spiegeln [...]\" (Quelle: Nds. Kultusministerium, Frauke Heiligenstadt)."
      - paragraph [ref=f16e28]: "Wir unterstützen unsere Schülerinnen und Schüler mit einem umfangreichen Angebot zur Berufsorientierung. Das aktuelle Konzept zur Berufsorientierung bietet einen kompletten - nach Jahrgängen sortierten - Überblick über alle Maßnahmen:"
      - paragraph [ref=f16e29]:
        - 'link "Konzept \"Berufsorientierung\" (Stand: 08/2025)" [ref=f16e30] [cursor=pointer]':
          - /url: files/berufsorientierung.pdf
      - heading "Profilbildung in Jahrgang 9 und 10" [level=3] [ref=f16e31]
      - paragraph [ref=f16e32]: An der Realschule John-F.-Kennedy-Platz sind seit dem 01.08.2011 alle Schüler und Schülerinnen der jetzigen 8. Klassen dazu verpflichtet, ein berufsvorbereitendes Profil zu wählen, welches mit zwei Wochenstunden im Wahlpflichtbereich unterrichtet wird.
      - paragraph [ref=f16e33]: "Bei uns stehen folgende Profile zur Auswahl:"
      - list [ref=f16e34]:
        - listitem [ref=f16e35]: "Profil 1: Sprachen (Französisch) - 4 Std."
        - listitem [ref=f16e36]: "Profil 2: Technik – 2 Std."
        - listitem [ref=f16e37]: "Profil 3: Gesundheit und Soziales - 2 Std."
        - listitem [ref=f16e38]: "Profil 4: Wirtschaft - 2 Std."
      - list [ref=f16e40]:
        - listitem [ref=f16e41]:
          - link "Mehr erfahren" [ref=f16e42] [cursor=pointer]:
            - /url: files/profile.pdf
      - paragraph [ref=f16e43]:
        - link "Die Bundesagentur für Arbeit informiert und berät zu allen Fragen rund um die Themen Berufsausbildung und Studium an dieser Schule. Weitere Informationen dazu im Portal der Bundesagentur für Arbeit." [ref=f16e44] [cursor=pointer]:
