        - heading "Impressionen" [level=2] [ref=f1e28]
        - link [ref=f1e30] [cursor=pointer]:
          - /url: images/jannes_horn.jpg
          - img "Jannes Horn zu Besuch" [ref=f1e31]
        - heading "Ehemaliger Schüler und Fußballprofi Jannes Horn zu Besuch an unserer Schule" [level=4] [ref=f1e32]
        - paragraph [ref=f1e33]: "Ein ganz besonderer Tag für unsere Schule: Der ehemalige Schüler und heutige Fußballprofi Jannes Horn hat uns besucht! Nach einem Austausch mit Herrn Aydin kam es zu diesem besonderen Besuch, bei dem die Schülerinnen und Schüler die Gelegenheit hatten, spannende Fragen an Jannes zu stellen. Jannes nahm sich viel Zeit, um offen und ehrlich zu antworten, was für die Schülerinnen und Schüler eine inspirierende Erfahrung war."
        - paragraph [ref=f1e34]: Doch nicht nur die Schülerinnen und Schüler waren begeistert – auch im Kollegium kam Jannes mit seinen ehemaligen Lehrkräften und seinem damaligen Klassenlehrer ins Gespräch. Gemeinsam tauschten sie sich über die vergangenen Schuljahre aus.
        - paragraph [ref=f1e35]: Ein ganz besonderes Highlight war der Videocall mit Ismail Jakobs, der aktuell bei Galatasaray Istanbul spielt. Ismail, ein ehemaliger Teamkollege von Jannes, nahm sich Zeit für ein Gespräch mit der Klasse und sorgte für strahlende Gesichter bei den Galatasaray-Fans.
        - link [ref=f1e37] [cursor=pointer]:
          - /url: images/trikot_horn.jpg
          - img "Das Trikot von Jannes Horn" [ref=f1e38]
        - paragraph [ref=f1e39]: Als besondere Erinnerung brachte Jannes uns ein Trikot aus seiner Zeit beim VfL Wolfsburg mit. Dieses wird eingerahmt und bekommt einen ganz besonderen Platz an unserer Schule – ein sichtbares Zeichen dafür, dass große Träume hier beginnen können.
        - paragraph [ref=f1e40]: Wir bedanken uns recht herzlich bei Jannes Horn für diesen unvergesslichen Besuch und wünschen ihm weiterhin viel Erfolg auf seinem Weg. Das Trikot wird eingerahmt und bekommt eine ganz besondere Stelle.
        - paragraph [ref=f1e41]:
          - strong [ref=f1e42]:
            - emphasis [ref=f1e43]: Willkommen zurück und viel Erfolg weiterhin, Jannes!
        - link [ref=f1e45] [cursor=pointer]:
          - /url: images/kicker1.jpg
          - img "Einweihung Kicker" [ref=f1e46]
        - heading "SV und Schulleitung weihen neuen Kicker ein" [level=4] [ref=f1e47]
        - paragraph [ref=f1e48]: Mit viel Spaß weihten die Schülervertretung und die Schulleitung den neuen Kickertisch in der Pausenhalle ein. Hiermit sind nicht nur spannende Kickerturniere, sondern auch andere Spiele, wie Billard möglich. Wir freuen uns auf viele spannende Matches!
        - link [ref=f1e50] [cursor=pointer]:
          - /url: images/lauftag_2024.png
          - img "Impressionen vom Lauftag" [ref=f1e51]
        - heading "Lauftag 2024" [level=4] [ref=f1e52]
        - paragraph [ref=f1e53]: Am 18. September fand unser jährlicher Lauftag statt. Die Schülerinnen und Schüler liefen fleißig viele Kilometer und holten sich an den von Lehrkräften besetzten Stationen ihre Stempel ab, um ihre Laufkarten zu füllen. Wir freuen uns, dass seitens der Elternschaft viele leckere Kuchen gespendet worden sind. Die Einnahmen aus dem Kuchenverkauf werden für den Schulgarten und für den Sportbereich verwendet, ebenso die Gelder, die von den Sponsoren unserer Schülerinnen und Schüler überwiesen werden. Wir bedanken uns herzlich bei allen Organisatoren, Helfern, Sponsoren und Läufern. Ein besonderer Dank geht auch an den Schulelternverein, der Mineralwasser für alle spendiert hat.
        - heading "\"Tag der Schiene\" bei Siemens in Braunschweig" [level=4] [ref=f1e54]
        - paragraph [ref=f1e55]: Schülerinnen und Schüler des 8. Jahrgangs besuchten gemeinsam mit den Lehrkräften Frau Amelsberg und Herrn Meyn den "Tag der Schiene" bei Siemens. Sie haben mit viel Spaß verschiedene Ausbildungsberufe kennengelernt und durften Berufe praktisch erkunden.
        - paragraph [ref=f1e56]:
          - link "Schülerbericht lesen" [ref=f1e57] [cursor=pointer]:
            - /url: files/tag_der_schiene.pdf
        - heading "Berufsfelderkundung für Schülerinnen und Schüler des 8. Jahrgangs" [level=4] [ref=f1e58]
        - paragraph [ref=f1e59]: Am 11. September stand im Rahmen unseres Programms zur Stärkung der Berufswahlkompetenz die Erkundung berufspraktischer Tätigkeiten im Hinblick auf verschiedene Berufsfelder an. In Zusammenarbeit mit der Ausbildungwerkstatt Braunschweig e. V. war es den Schülerinnen und Schülern möglich, verschiedene regionale Unternehmen kennenzulernen. Wir bedanken uns bei allen Beteiligten.
        - paragraph [ref=f1e60]:
          - link "Bilder ansehen" [ref=f1e61] [cursor=pointer]:
            - /url: files/berufsfelderkundung.pdf
        - heading "Waldtage der Jahrgänge 5 & 6" [level=4] [ref=f1e62]
        - paragraph [ref=f1e63]: Dank der tatkräftigen Unterstützung der Herbert Balke-Stiftung unter dem Dach der Bürgerstiftung Braunschweig, hatten die Schülerinnen und Schüler des 5. und des 6 Jahrgangs die Gelegenheit, drei Tage den Wald unter pädagogischer Anleitung kennenzulernen.
        - list [ref=f1e64]:
          - listitem [ref=f1e65]:
            - link "Bericht und Bilder ansehen" [ref=f1e66] [cursor=pointer]:
              - /url: files/waldtage_6b.pdf
        - link [ref=f1e67] [cursor=pointer]:
          - /url: images/zeitzeugen_2024.jpg
        - heading "Zeitzeugen" [level=4] [ref=f1e69]
        - paragraph [ref=f1e70]: In diesem Jahr haben Schüler:innen der 10. Klassen wieder Stolpersteinrecherchen durchgeführt. Besonders in diesem Jahr war, dass sie die Möglichkeit hatten, mit Verwandten der zu recherchierenden Familien in Kontakt zu treten. Daher kam es dazu, dass uns am 17.01.2024 Klaus Scheelhaase aus Hannover in unserer Schule besuchte und von seinen Erfahrungen berichtete. Das Zeitzeugeninterview war für uns alle sehr aufschlussreich und brachte uns die Geschichte etwas näher bzw. machte das Leben, welches seine Familie führte, für uns greifbarer/lebendiger.
        - paragraph [ref=f1e71]:
          - text: Die Ergebnisse unserer Recherchen haben wir am 12.03.2024 im Roten Saal vorgestellt. Nach der Präsentation ist von Okerwelle ein
          - link "Radiobeitrag" [ref=f1e72] [cursor=pointer]:
            - /url: https://okerwelle.de/2024/03/15/neue-stolpersteine-fuer-ns-opfer-braunschweiger-schueler-recherchierten-die-lebensgeschichten-betroffener-familien
          - text: verfasst worden.
        - heading "Besuch der Braunschweiger Azubi-Messe" [level=4] [ref=f1e73]
        - paragraph [ref=f1e74]:
          - text: Gestern fand die Braunschweiger Azubi-Messe im Eintracht-Stadion statt. Interessierte Schülerinnen und Schüler besuchten diese - gemeinsam mit Lehrkräften des entsprechenden Fachbereichs. Mehr Informationen zur Messe gibt es unter
          - link "www.ausbildungsstart.com" [ref=f1e75] [cursor=pointer]:
            - /url: https://www.ausbildungsstart.com
          - text: .
        - heading "Präventionsprojekt \"LARS & LISA\"" [level=4] [ref=f1e76]
        - paragraph [ref=f1e77]: Das von der Stadt Braunschweig geförderte Präventionsprojekt zur Förderung psychischer Gesundheit und Wohlbefinden für Schüler*innen kommt an unsere Schule, genauer in die Klasse 8b! Die Realschule John-F.-Kennedy- Platz reagiert damit als eine der ersten Schulen in Braunschweig auf die Ergebnisse der CTC-Jugendbefragung (Communities That Care) aus dem Jahr 2022.
        - paragraph [ref=f1e78]:
          - text: Das Programm „LARS & LISA – Lust an realistischer Sicht und Leichtigkeit im sozialen Alltag“ wollen wir in 10 Doppelstunden- immer freitags in der 1. und 2. Schulstunde- durchführen. Es geht in dem Training um die Stärkung von Fähigkeiten, die für das ganze Leben wertvoll sind, wie z.B. Resilienz ... weitere Infos
          - link "hier" [ref=f1e79] [cursor=pointer]:
            - /url: files/larsundlisa.pdf
          - text: .
        - link [ref=f1e81] [cursor=pointer]:
          - /url: images/out.jpg
        - heading "„Out-Gefangen im Netz“ - Das Lessingtheater Wolfenbüttel im Klassenzimmer" [level=4] [ref=f1e83]
        - paragraph [ref=f1e84]: Zusammen mit Frau Fricke, der Präventionsbeamtin der Polizei Braunschweig, dem Präventionsrat Braunschweig und dem Lessingtheater Wolfenbüttel gelang es, Präventionstage zum Thema Cybermobbing für den 9. Jahrgang durchzuführen. Hierzu kam an mehreren Tagen das Lessingtheater Wolfenbüttel an unserer Schule, um das Stück „Out-Gefangen im Netz“ aufzuführen. In diesem gelang es dem Schauspieler Ronald Schober auf brillante Weise die Geschichte der Schülerin Viktoria darzustellen.
        - paragraph [ref=f1e85]: Viktoria, zentrale Figur des Stückes, wird gemobbt. Posts von Partys und einer Kursfahrt nach London sowie Fake-Fotos werden von allen geteilt und kommentiert. Die Dinge geraten außer Kontrolle und der Zuschauer erfährt, wie ohnmächtig Victoria und selbst die Erwachsenen dem Ganzen gegenüberstehen.
        - paragraph [ref=f1e86]: „Out-Gefangen im Netz“ ist ein Stück, dass uns die Gefahren des Internets vor Augen gehalten und die Bedeutsamkeit von Zivilcourage verdeutlicht hat.
        - paragraph [ref=f1e87]: Wir danken Frau Fricke für die tolle inhaltliche Aufarbeitung des Stückes mit unseren Schüler:innen, dem Präventionsrat Braunschweig für die großzügige finanzielle Unterstützung sowie dem Theater Wolfenbüttel für die großartige Vorstellung!
        - blockquote [ref=f1e88]:
          - strong [ref=f1e89]: Out – Gefangen im Netz - ein Bericht von Rafaela Petsiani und Berat Sener, 9 b
          - text: Am 14. November hatte unsere Klasse großes Glück das Theaterstück von Knut Winkmann „Out-Gefangen im Netz“ erleben zu dürfen. Ein etwas komischer Mann kam in unser Klassenzimmer und gab sich als ein Kriminalkommissar aus. Wir alle waren sehr verwundert und verstanden auf den ersten Blick nicht genau, was uns alle nun erwarten würde. Doch es stellte sich heraus, dass der Mann, Ronald Schober, ein Schauspieler, war und er uns näher bringen wollte, was das Gefährliche an Cybermobbing sein kann. Nach ungefähr einer Stunde, war das Stück vorbei und wir haben in unserer Klasse noch weiter über das Thema Cybermobbing gesprochen und über den Vorfall, den Ronald Schober uns vorgespielt hatte. Es ging um ein Mädchen, das sie Victoria genannt hatten. Sie war sehr offen, doch sie hatte sehr viele Probleme, was Freundschaften anging, weil sie einen Online-Blog machte und viele Menschen sie wegen ihrer Darbietung nicht ernst genommen hatten. Sie wurde gemobbt in ihrer neuen Klasse und musste miterleben, wie es sein kann, von allen Menschen in seinem Umfeld wegestoßen zu werden. Unserer Meinung nach war das Stück ein voller Erfolg. Ronald Schober zeigte uns etwas sehr Trauriges und machte es uns durch seine Darstellung verständlich. Daher bedanken wir uns bei den Sponsoren, die es uns ermöglicht haben, dieses Stück anzusehen und wir bedanken uns vor allem, bei unserer Klassenlehrerin Frau Pohle.
