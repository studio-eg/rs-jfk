      - paragraph [ref=e48]: Jede Schule hat eine Schulleiterin oder einen Schulleiter, die/der die Gesamtverantwortung für die Schule und deren Qualitätsentwicklung trägt, Lehrkräfte im Unterricht berät und für die Einhaltung der Rechts- und Verwaltungsvorschriften sorgt.
    - generic [ref=e50]:
      - heading "Mitwirkung & Gremien" [level=2] [ref=e52]
      - generic [ref=e53]:
        - generic [ref=e56]:
          - text: "01"
          - heading "Verwaltung" [level=3] [ref=e57]
          - paragraph [ref=e58]: Schulsekretärinnen erledigen den Verwaltungs- und Schreibdienst in allen Schulangelegenheiten. Schulassistent:innen entlasten die Lehrkräfte bei der Vor- und Nachbereitung des Unterrichts. Unser Hausmeister sorgt für die haustechnischen Anlagen und Außenanlagen.
        - generic [ref=e61]:
          - text: "02"
          - heading "Schulvorstand" [level=3] [ref=e62]
          - paragraph [ref=e63]: Im Schulvorstand wirken Schulleitung, Lehrkräfte, Erziehungsberechtigte sowie Schülerinnen und Schüler zusammen, um die Qualitätsentwicklung der Schule zu gestalten.
        - generic [ref=e66]:
          - text: "03"
          - heading "Lehrerkollegium" [level=3] [ref=e67]
          - paragraph [ref=e68]: Unsere Lehrkräfte erziehen und unterrichten in eigener pädagogischer Verantwortung und stehen in einem unmittelbaren Dienstverhältnis zum Land Niedersachsen.
        - generic [ref=e71]:
          - text: "04"
          - heading "Kommunale Schulsozialarbeit & Beratung" [level=3] [ref=e72]
          - paragraph [ref=e73]: Die Schulsozialarbeit unterstützt einzelfallbezogen dabei, Chancengleichheit herzustellen. Unsere Beratungslehrkraft moderiert die Beratungskonferenz und pflegt den Austausch mit externen Beratungsstellen der Stadt Braunschweig.
        - generic [ref=e74]:
          - generic [ref=e75]: S
          - generic [ref=e77]:
            - text: "05"
            - heading "Schülervertretung" [level=3] [ref=e78]
            - paragraph [ref=e79]: Schülerinnen und Schüler wirken über Klassensprecher:innen, den Schülerrat und Vertreter:innen in Konferenzen und im Schulvorstand aktiv an der Schulgemeinschaft mit.
        - generic [ref=e80]:
          - generic [ref=e81]: S
          - generic [ref=e83]:
            - text: "06"
            - heading "Schulelternrat" [level=3] [ref=e84]
            - paragraph [ref=e85]: Die Vorsitzenden der Klassenelternschaften bilden den Schulelternrat, der mindestens zweimal jährlich tagt und Vertreter:innen in die Gesamtkonferenz entsendet.
        - generic [ref=e86]:
          - generic [ref=e87]: S
          - generic [ref=e89]:
            - text: "07"
            - heading "Schulelternverein" [level=3] [ref=e90]
            - paragraph [ref=e91]: Der Schulelternverein unterstützt die Ausstattung der Schule mit Lehrmitteln, hilft bedürftigen Schülerinnen und Schülern bei Klassenfahrten und finanziert Schulveranstaltungen.
      - paragraph [ref=e92]: Eine namentliche Übersicht unseres Lehrerkollegiums sowie der Klassenlehrkräfte finden Kolleginnen, Kollegen, Schülerinnen und Schüler über IServ.
