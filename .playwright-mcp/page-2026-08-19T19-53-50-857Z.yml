  - generic [ref=f13e21]:
    - heading "Lage & Ausstattung" [level=2] [ref=f13e23]
    - generic [ref=f13e25]:
      - link [ref=f13e26] [cursor=pointer]:
        - /url: lage_ausstattung.html
      - heading "Lage" [level=3] [ref=f13e28]
      - paragraph [ref=f13e29]: Die Realschule John-F.-Kennedy-Platz ist eine von sieben Realschulen in der Stadt Braunschweig. Der Schulstandort ist gekennzeichnet durch seine zentrale Lage in der Innenstadt und daher verkehrsgünstig zu erreichen.
      - paragraph [ref=f13e30]: Da es keine Einzugsgebiete gibt, kommen Schülerinnen und Schüler aus dem gesamten Stadtgebiet zum Kennedy-Platz. Dabei gibt es eine gute Mischung von Schülern aus den eher ländlich strukturierten Randbereichen, der Innenstadt und dem Ballungsgebiet der Weststadt.
      - heading "Ausstattung" [level=3] [ref=f13e31]
      - paragraph [ref=f13e32]: Modernisierte Fachräume für Naturwissenschaften, Informatik, Musik, Hauswirtschaft, Textiles Gestalten und Werken stehen zur Verfügung. Die Schule ist flächendeckend mit WLAN versorgt.
      - paragraph [ref=f13e33]: Alle Schülerinnen, Schüler und Lehrkräfte verfügen über einen IServ-Zugang und erhalten für die Zeit ihrer Schulzugehörigkeit das Office-Paket der Firma Microsoft.
      - paragraph [ref=f13e34]: Es gibt mehrere Notebook-Wagen und IPad-Klassensätze, so dass mobiles Arbeiten möglich ist.
      - heading "Beratungszimmer" [level=4] [ref=f13e35]
      - paragraph [ref=f13e36]: Sollten Schülerinnen, Schüler und/oder Eltern Gesprächsbedarf haben, steht unsere Beratungslehrkraft, Frau Kanngießer, nach Absprache gern zur Verfügung. Diese - mitunter schwierigen - Gespräche finden dann in ruhiger und entspannter Atmosphäre im Beratungszimmer statt.
      - heading "Caféteria" [level=4] [ref=f13e37]
      - paragraph [ref=f13e38]: Eine Caféteria bietet Pausensnacks unter dem Gesichtspunkt "Gesundes Frühstück" an. Es gibt belegte Brötchen, Gebäck, Gemüse und vieles mehr. Die Bewirtschaftung erfolgt in Kooperation mit der VHS-Gruppe "Arbeit und Beruf" und wird von den Schülern in den Pausen sehr gut angenommen.
      - heading "Schließfächer" [level=4] [ref=f13e39]
      - paragraph [ref=f13e40]: An unserer Schule stehen Schließfächer der Firma Mietra bereit.
      - paragraph [ref=f13e41]: "Ein Mietra Schul- Schließfach erleichtert die schwere Schultasche und bewahrt persönliche Sachen sicher auf. Anmeldung, Service und Kündigung können direkt im Internet abgewickelt werden. Mietra empfiehlt die Anmeldung des Schließfaches im Internet: Dafür gibt es einen Nachlass auf die Miete und einen noch schnelleren Zugang zum Schließfach."
      - paragraph [ref=f13e42]:
        - text: => Hier geht´s zu den
        - link "Mietra Schließfächern" [ref=f13e43] [cursor=pointer]:
          - /url: http://www.schliessfaecher.de
      - heading "Sport" [level=4] [ref=f13e44]
      - paragraph [ref=f13e45]: Neben der eigenen Turnhalle gibt es in der Schule einen von den Schülern eingerichteten Fitnesskeller, einen umfangreichen Skikeller mit Langlauf- und Alpinskiern sowie 9 Paddelboote mit eigenem Liegeplatz an der Oker.
      - paragraph [ref=f13e46]: Der Schulhof verfügt u. a. über Tischtennisplatten, Kickertische, einen Niedrigseilgarten und ein Basketballfeld. In den großen Pausen werden Sportgeräte (z. B. kleine Fußballtore, Hockeyschläger, Softbälle) ausgeliehen.
      - heading "Schulgarten" [level=4] [ref=f13e47]
      - paragraph [ref=f13e48]: Die Schule hat einen eigenen Schulgarten, der unmittelbar an das Gebäude grenzt. Der Garten ist für Unterrichtszwecke im Freien sehr gut geeignet. Es befinden sich dort genügend Bänke sowie ein kleiner Teich.
