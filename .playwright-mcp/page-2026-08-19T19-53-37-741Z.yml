      - separator [ref=f12e274]
      - heading [level=3] [ref=f12e275]:
        - text: Sport
        - img "Sport" [ref=f12e277]
      - paragraph [ref=f12e278]: Unsere Halle ist klein und auch der Schulhof bietet nur eingeschränkten Sportunterricht ….. ABER, wir haben schon oft die Auszeichnung als sportfreundliche Schule bekommen! Wir nutzen den Vorteil der Innenstadt!
      - list [ref=f12e279]:
        - listitem [ref=f12e280]: Eigene Kanus für eine Okertour!
        - listitem [ref=f12e281]: Frisbee, Orientierungsläufe, Disc-Golf im Bürgerpark!
        - listitem [ref=f12e282]: Sponsoren-Lauftag am Lünischteich
        - listitem [ref=f12e283]: Sportspiele und Leichtathletik auf dem Löwenwall!
        - listitem [ref=f12e284]: "Außerschulische Sportorte wie: Kletterhalle und Wakepark in Wolfsburg sind von uns aus gut zu erreichen!"
        - listitem [ref=f12e285]: Kooperation mit Eintracht Braunschweig und dem VfL Wolfsburg, für Fußball-Turniere und Freikarten zu Spielen!
      - paragraph [ref=f12e286]: "Bei uns lernst DU durch Sport, Spiel und Bewegung mit den Materialien, die DIR die Schülerinnen und Schüler im Bild präsentieren, wie DU:"
      - list [ref=f12e287]:
        - listitem [ref=f12e288]: Techniken der vielen Sportarten verbesserst,
        - listitem [ref=f12e289]: ebenfalls wirst du neue Sportspiele kennen lernen und diese mit Änderungen des Regelwerks auf deine neue Klasse anpassen!
        - listitem [ref=f12e290]: Du wirst mit Sieg und Niederlage weiter umgehen lernen und vertiefen, dass jedes Klassenmitglied ein positives Sporterlebnis erfahren wird, wenn Ihr rücksichtsvoll miteinander umgeht, weil Sport für Euer Sozialverhalten total wichtig ist!
        - listitem [ref=f12e291]: Sportunterricht ist kein Vereinssport, bei uns steht das Miteinander im Vordergrund!
