      - heading "Mathematik" [level=4] [ref=f12e112]
      - paragraph [ref=f12e113]: Mathematik …ja, das kennst du schon aus der Grundschule! Unser Mathematikunterricht wird sich auch vom Inhalt her von dem der anderen Schulen wenig unterscheiden! Du wirst weiter erfahren, wo überall Mathematik im täglichen Leben steckt! Du wirst den Unterricht lieben, verfluchen oder hinnehmen … wie auch anderswo. Du wirst aber hier auf Lehrerinnen und Lehrer treffen, die versuchen werden, dir alles so gut wie möglich zu erklären.
      - separator [ref=f12e114]
      - link [ref=f12e115] [cursor=pointer]:
        - /url: fachbereiche.html
      - heading "Naturwissenschaften" [level=4] [ref=f12e117]
      - paragraph [ref=f12e118]: Liebe Eltern und zukünftige Fünftklässler, herzlich Willkommen im Fachbereich Naturwissenschaften.
      - paragraph [ref=f12e119]: Unter Naturwissenschaften werden die Fächer Biologie, Chemie und Physik zusammengefasst. Diese drei Fächer sind nicht ganz neu für Euch, da ihr diese in der Grundschule schon als Fach Sachkunde kennengelernt habt. Hinter den drei Fächern verbirgt sich natürlich mehr als dass was ihr schon bis jetzt im Fach Sachkunde kennengelernt habt. Hier bekommt ihr einen kleinen Einblick in die einzelnen Fächer. Schaut Euch einmal das Begrüßungsvideo an, indem sich die einzelnen Fächer kurz vorstellen.
      - paragraph [ref=f12e120]:
        - link "Begrüßungsvideo ansehen" [ref=f12e121] [cursor=pointer]:
          - /url: video/bio_chemie_physik.mp4
      - paragraph [ref=f12e122]: Für die, die schon zu Hause naturwissenschaftlichen Arbeiten möchten, haben wir eine Sammlung verschiedener Versuche erstellt. Wichtig, die Versuche dürfen nur unter Aufsicht der Erziehungsberechtigten durchgeführt werden.
      - list [ref=f12e123]:
        - listitem [ref=f12e124]:
          - link "Biologie - Experiment für zuhause" [ref=f12e125] [cursor=pointer]:
