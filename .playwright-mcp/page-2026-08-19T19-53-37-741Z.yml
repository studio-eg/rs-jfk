      - heading "Französisch" [level=4] [ref=f12e76]
      - paragraph [ref=f12e77]: Ab der 6. Klasse kann das Fach Französisch im Wahlpflichtbereich gewählt werden. Französisch ist ein Hauptfach und wird deshalb 4 Stunden pro Woche unterrichtet.
      - paragraph [ref=f12e78]:
        - strong [ref=f12e79]:
          - emphasis [ref=f12e80]: Aber was wird im Französischunterricht gemacht?
      - paragraph [ref=f12e81]: Ziel ist es, dass nach und nach gelernt wird, wie man Alltagsgespräche auf Französisch führt (z.B. wird gelernt, wie man sich vorstellt, wie man nach dem Weg fragt oder wie man sich etwas zu Essen zu bestellt). Geübt werden dabei die Bereiche Lesen, Hören, Schreiben, Übersetzen und natürlich Sprechen. Dafür müssen natürlich – wie im Englischunterricht auch – Grammatikregeln und Vokabeln gelernt werden.
      - paragraph [ref=f12e82]:
        - strong [ref=f12e83]:
          - emphasis [ref=f12e84]: Womit wird gearbeitet?
      - paragraph [ref=f12e85]: "Wir arbeiten z.B. mit:"
      - list [ref=f12e86]:
        - listitem [ref=f12e87]: dem Schulbuch und Arbeitsheft „Tous ensemble“ vom Klett-Verlag
        - listitem [ref=f12e88]: Online-Spielen zu den aktuellen Vokabeln oder Grammatikregeln
        - listitem [ref=f12e89]: Vokabelspielen im Klassenraum
        - listitem [ref=f12e90]: Erklärvideos für Grammatikregeln
      - paragraph [ref=f12e91]:
        - text: Im Französischunterricht werden neben Klassenarbeiten auch mündliche Prüfungen gemacht und wir erstellen - je nach Thema - z.B. auch Comics online, Power-Point-Präsentationen oder Audio-Dateien. Ein schöner Zusatz ist, dass man sich auch mal mit
        - link "selbst gebackenen Crêpes" [ref=f12e92] [cursor=pointer]:
