      - heading "Englisch" [level=4] [ref=f12e64]
      - paragraph [ref=f12e65]: An der John-F.-Kennedy Realschule wird das Fach Englisch 4 Stunden pro Woche in allen Jahrgängen unterrichtet, wobei das Lehrwerk „Lighthouse“ von Cornelsen die Grundlage schafft, um die Kompetenzen Lesen, Schreiben, Sprechen und Dolmetschen zu erarbeiten. Ein Muttersprachler aus dem englischsprachigen Raum unterstützt die Lehrkräfte als „Teaching Assistant“ (derzeit pandemiebedingt leider nicht möglich). In den Jahrgängen 6 und 8 wird eine Onlinediagnose durchgeführt, die den Schülerinnen und Schülern ihre Stärken und Schwächen aufzeigt und gleichzeitig individuelle Fördermaterialien bietet. Außerdem kann in diesen Jahrgängen eine Klassenarbeit durch eine mündliche Prüfung ersetzt werden, um auf die Abschlussprüfungen in Klasse 10 vorzubereiten und die sprachliche Kompetenz zu stärken.
      - paragraph [ref=f12e66]: Ab Jahrgang 6 wählen Schülerinnen und Schüler Wahlpflichtkurse, aktuell besteht in den Jahrgängen 6, 8 und 10 die Möglichkeit, Englisch zu wählen, um dort lehrwerkunabhängig frei und kreativ arbeiten zu können (zum Beispiel das Lesen einer Lektüre).
      - paragraph [ref=f12e67]:
