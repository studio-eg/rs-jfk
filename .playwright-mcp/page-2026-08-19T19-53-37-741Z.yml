      - heading "Musisch-kulturelle Bildung" [level=3] [ref=f12e197]
      - paragraph [ref=f12e198]: "Musisch-kulturelle Bildung hat - gerade in der heutigen Zeit - einen hohen Stellenwert. Einen kleinen Überblick über aktuelle Schülerarbeiten bietet der folgende Film (bitte Bild anklicken, um zu starten):"
      - link [ref=f12e199] [cursor=pointer]:
        - /url: video/mukubi.mp4
      - separator [ref=f12e201]
      - heading "Religion / Werte und Normen" [level=3] [ref=f12e202]
      - paragraph [ref=f12e203]:
        - strong [ref=f12e204]:
          - emphasis [ref=f12e205]: Religion oder Werte und Normen?
      - paragraph [ref=f12e206]: Der Artikel 4 des Grundgesetzes betont die Religionsfreiheit! Das heißt, du hast ein Recht auf Religion, andererseits hast du aber auch das Recht auf Abmeldung vom Religionsunterricht und die Entscheidung für das Fach „Werte und Normen“. Du triffst bei deiner Anmeldung an der John-F.-Kennedy-Schule also die Entscheidung, ob „WuN“ oder „Reli“!
      - link [ref=f12e207] [cursor=pointer]:
        - /url: fachbereiche.html
      - heading "Religion" [level=4] [ref=f12e209]
      - paragraph [ref=f12e210]: Laut Artikel 7 des Grundgesetzes und der Paragrafen 124 bis 128 des Niedersächsischen Schulgesetztes ist das Fach Religion ein „ordentliches Unterrichtsfach“ und wird als einziges Fach im Grundgesetz namentlich erwähnt. Der Religionsunterricht leistet damit einen eigenständigen und wichtigen Beitrag zum Bildungsauftrag der Schule.
      - paragraph [ref=f12e211]:
        - strong [ref=f12e212]:
          - emphasis [ref=f12e213]: Wie ist der Religionsunterricht an unserer Schule organisiert?
      - paragraph [ref=f12e214]: Religion wird überwiegend konfessionell unterrichtet. Das bedeutet für dich, du kannst zwischen dem katholischen und evangelischen Religionsunterricht wählen.
      - paragraph [ref=f12e215]: In einigen Jahrgängen lernen aber Schüler:innen der evangelischen und katholischen Konfession in einer Gruppe zusammen. Das nennt man dann konfessionell-kooperativen Religionsunterricht. Egal wie, katholische und evangelische Religionslehrer:innen, arbeiten an unserer Schule eng zusammen.
      - paragraph [ref=f12e216]:
        - strong [ref=f12e217]:
          - emphasis [ref=f12e218]: Damit wirst du dich im Unterricht beschäftigen
      - paragraph [ref=f12e219]: "Wir möchten mit euch fragen, diskutieren, lernen und lachen. Der Religionsunterricht soll dir Zeit geben, um über Fragen wie diese nachzudenken:"
      - list [ref=f12e220]:
        - listitem [ref=f12e221]: Ist es besser zu wissen als zu glauben?
        - listitem [ref=f12e222]: Gibt es (einen) Gott?
        - listitem [ref=f12e223]: Woher kommt die Welt?
        - listitem [ref=f12e224]: Woran glauben andere Menschen?
        - listitem [ref=f12e225]: Wieso gibt es so viel Leid in der Welt?
        - listitem [ref=f12e226]: Was ist gerecht?
      - paragraph [ref=f12e227]: Dabei werden wir unterschiedliche Antworten finden.
      - paragraph [ref=f12e228]:
        - strong [ref=f12e229]:
          - emphasis [ref=f12e230]: Das erwartet dich bei uns
      - paragraph [ref=f12e231]: Erstmalig soll die Zeugnisausgabe der Schüler:innen der Abschlussklassen im Rahmen eines Gottesdienstes in der Magni-Kirche stattfinden. Des Weiteren möchten wir in diesem Jahr in den letzten Schultagen vor den Weihnachtsferien einen Schulgottesdienst veranstalten.
      - paragraph [ref=f12e232]: "Außerdem sind folgende weitere schulische Aktivitäten für die Jahrgänge 5-10 möglich:"
      - list [ref=f12e233]:
        - listitem [ref=f12e234]: Besuch von christlichen Gemeinden
        - listitem [ref=f12e235]: Besuch von Moschee und Synagoge
        - listitem [ref=f12e236]: Besuch des Hospizes
        - listitem [ref=f12e237]: Besuch diakonischer Einrichtungen
        - listitem [ref=f12e238]: Interviews mit Braunschweiger:innen
