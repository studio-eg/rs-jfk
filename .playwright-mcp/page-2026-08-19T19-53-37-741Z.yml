      - heading [level=4] [ref=f12e155]:
        - strong [ref=f12e156]:
          - emphasis [ref=f12e157]: Was lerne ich eigentlich in Erdkunde?
      - paragraph [ref=f12e158]: Das Fach Erdkunde beschäftigt sich mit der Erde und den durch die Natur und den Menschen verursachten Veränderungen. Ihr sollt die Einsicht in diese Zusammenhänge zwischen natürlichen Begebenheiten und menschlichen Aktivitäten in verschiedenen Regionen der Erde erhalten. Vor allem die Räumliche Orientierung spielt eine wichtige Rolle im Unterricht– auch wenn die digitalen Medien die Kartenarbeit im Alltag verdrängen, ist sie weiterhin wichtig. Wie orientiere ich mich eigentlich ohne Handy, Google Maps & Co.? Aber auch digitale Medien spielen eine Rolle im Erdkundeunterricht und helfen uns bei der Erkundung der Welt.
