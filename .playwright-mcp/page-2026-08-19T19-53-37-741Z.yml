      - heading "Arbeit / Wirtschaft - Technik" [level=3] [ref=f12e180]
      - paragraph [ref=f12e181]: Hast du schon einen Traumberuf? Auf unserer schuleigenen Berufsmesse bekommst du Einblicke in verschiedenste Berufe und lernst Unternehmen aus der Region kennen. Zudem kannst du hier Plätze für ein Berufspraktikum oder eine spätere Ausbildung ergattern. Wir helfen dir dabei, einen Beruf zu finden, der dir gefällt und zu dir passt. In diesem Rahmen besuchst du z.B. die Agentur für Arbeit, weitere Berufsmessen in Braunschweig, wählst Profile sowie Wahlpflichtkurse, nimmst an einem Bewerbungstraining teil und besuchst verschiedene Unternehmen in Praxistagen.
      - link [ref=f12e182] [cursor=pointer]:
        - /url: fachbereiche.html
      - heading "Werken/Technik" [level=4] [ref=f12e184]
      - text: In
      - strong [ref=f12e185]: Klasse 6
      - text: erstellen die SchülerInnen im Fach Werken je nach Lerngruppe einen Bilderständer, Handyhalter oder Puzzle, um Grundlagen in der Holzbearbeitung kennen zu lernen und ein Gefühl für das Material zu bekommen.
      - paragraph
      - paragraph [ref=f12e186]:
        - text: In
        - strong [ref=f12e187]: Klasse 8
        - text: "erstellen alle SchülerInnen ein Steckspiel mit der Hand. Dauer: Ein Halbjahr ; Ziel: Erleichterung der Profilwahl"
      - link [ref=f12e188] [cursor=pointer]:
        - /url: fachbereiche.html
      - paragraph [ref=f12e190]:
        - text: In den
        - strong [ref=f12e191]: Jahrgängen 9 und 10
        - text: ist Technik ein Profilfach.
      - paragraph [ref=f12e192]: Durch die Kooperation mit der BBS Johannes- Selenka- Schule findet der Unterricht in Klasse 9 auch in der Bauhalle am Inselwall statt, wo Grundlagen des Betonbaus vermittelt werden. Im 10. Jahrgang werden die in Klasse 8 erworbenen Kenntnisse derart erweitert, dass das Steckspiel mit einer CNC-Maschine erstellt wird. Ferner werden verschiedene Werkstücke an einer Drechselmaschine hergestellt.
      - heading "Hauswirtschaft" [level=4] [ref=f12e193]
      - paragraph [ref=f12e194]:
        - 'link "Film: Muffins backen in der Schulküche" [ref=f12e195] [cursor=pointer]':
