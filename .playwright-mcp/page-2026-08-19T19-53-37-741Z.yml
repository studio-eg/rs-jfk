        - emphasis [ref=f12e131]: Viel Spaß!
      - separator [ref=f12e132]
      - heading "Geschichtlich-soziale Weltkunde" [level=3] [ref=f12e133]
      - paragraph [ref=f12e134]: Die Abkürzung für "Geschichtlich-soziale Weltkunde" lautet GSW und beinhaltet die Fächer Geschichte, Politik und Erdkunde. Die Fächer Erdkunde und Geschichte werden ab der 5. Klasse unterrichtet und Politik ab der 7. Klasse.
      - link [ref=f12e135] [cursor=pointer]:
        - /url: images/geschichte.png
      - heading [level=4] [ref=f12e137]:
        - strong [ref=f12e138]:
          - emphasis [ref=f12e139]: Womit beschäftige ich mich im Fach Geschichte?
      - paragraph [ref=f12e140]: Das Fach Geschichte vermittelt Kenntnisse über vergangenes Handeln und Zusammenleben der Menschen von der Steinzeit bis zur Neuzeit. Ihr erfahrt, welche verschiedenen Probleme sich dadurch ergeben haben und auf welche Weise diese gelöst wurden. Bei der Wissensvermittlung spielen sowohl digitale Medien als auch außerschulische Lernorte eine Rolle. Der jeweilige Jahrgang 9 übernimmt die Patenschaft für einige Stolpersteine. Zudem haben wir eine Zusammenarbeit mit der Gedenkstätte Schillstraße und dem IJN.
      - heading [level=4] [ref=f12e141]:
        - strong [ref=f12e142]:
          - emphasis [ref=f12e143]: Worum geht es im Politikunterricht?
      - paragraph [ref=f12e144]: Durch den Politikunterricht sollt ihr eine konkrete Vorstellung davon bekommen, was Politik alles sein kann und wo ihr in eurem Umfeld mit Politik in Kontakt kommen. So lernt ihr beispielsweise die Grund- und Menschenrechte für euch und eure Mitmenschen im Umgang miteinander zu nutzen und zu achten, ihr „baut“ eure eigene Gemeinde und lernt so die politischen Strukturen spielerisch kennen. Das Ziel ist das Verständnis für die demokratische Gestaltung der Gesellschaft und Schutz dieser. Außerdem erwerbt ihr ein grundlegendes Verständnis der demokratischen Prinzipien und lernen, wie wichtig es ist, diese zu schützen. Dieses Wissen wird auch mithilfe von digitalen Medien vermittelt, denn diese bestimmen auch euren Alltag und es sind auch diese, die zur Informationsbeschaffung genutzt werden. Somit sind sie im Unterricht Lernmittel als auch Unterrichtsgegenstand.
      - paragraph [ref=f12e145]:
        - strong [ref=f12e146]:
          - emphasis [ref=f12e147]: Schülerarbeiten "EU in der Streichholzschachtel"
