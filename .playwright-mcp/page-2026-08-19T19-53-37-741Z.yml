      - heading "Werte und Normen" [level=4] [ref=f12e242]
      - paragraph [ref=f12e243]:
        - strong [ref=f12e244]:
          - emphasis [ref=f12e245]: Warum ist das Fach „WuN“ so wichtig?
      - paragraph [ref=f12e246]: Der Unterricht soll
      - list [ref=f12e247]:
        - listitem [ref=f12e248]: deine Persönlichkeitsentwicklung unterstützen,
        - listitem [ref=f12e249]: deine Selbstständigkeit und Eigenverantwortung fördern,
        - listitem [ref=f12e250]: dich zu einer ethischen Urteilsbildung befähigen
        - listitem [ref=f12e251]: dir Wertevorstellungen vermitteln (z.B. Grund- und Menschenrechte).
      - paragraph [ref=f12e252]:
        - strong [ref=f12e253]:
          - emphasis [ref=f12e254]: Worum geht es im Fach „Werte und Normen“?
      - paragraph [ref=f12e255]: In dem Fach „Werte und Normen“ geht es um alltägliche Themen und Fragen, die jeden von uns früher oder später betreffen. Dabei unterscheiden sich die Fächer „Religion“ und „Werte und Normen“ kaum inhaltlich, sie betrachten ähnliche Fragestellungen, Probleme und Sachverhalte. Im Fach „Werte und Normen“ betrachtest du Fragestellungen aus religionswissenschaftlicher, gesellschaftlicher und philosophischer Sicht.
      - paragraph [ref=f12e256]:
        - strong [ref=f12e257]:
          - emphasis [ref=f12e258]: "Damit wirst du dich im Unterricht beschäftigen:"
      - paragraph [ref=f12e259]: Wir möchten mit euch Fragen entwickeln, diskutieren, reflektieren, lernen und lachen. Der Unterricht soll dir Zeit geben, um über Fragen wie
      - list [ref=f12e260]:
        - listitem [ref=f12e261]: Wer bin ich?
        - listitem [ref=f12e262]: Ist es besser zu wissen als zu glauben?
        - listitem [ref=f12e263]: Gibt es (einen) Gott oder nicht?
        - listitem [ref=f12e264]: Woher kommt die Welt?
        - listitem [ref=f12e265]: Gibt es ein Leben nach dem Tod?
        - listitem [ref=f12e266]: Woran glauben andere Menschen?
        - listitem [ref=f12e267]: Wieso gibt es so viel Leid in der Welt?
        - listitem [ref=f12e268]: Was ist gerecht?
        - listitem [ref=f12e269]: Darf man Notlügen gebrauchen?
        - listitem [ref=f12e270]: Was ist Glück?
      - paragraph [ref=f12e271]: nachzudenken.
