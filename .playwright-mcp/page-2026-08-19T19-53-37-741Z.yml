      - heading "Deutsch" [level=4] [ref=f12e27]
      - paragraph [ref=f12e28]: Der Fachunterricht Deutsch ist an der Realschule John-F.-Kennedy grundsätzlich integrativ angelegt, d.h. er berücksichtigt immer alle Lernbereiche des Faches. Wir arbeiten dabei mit dem Lehrwerk „Praxis Deutsch“ aus dem Westermann Verlag. Am Anfang von Klasse 6, 8 und 10 wird eine Lernstandserhebung mit Hilfe der Online-Diagnose von Westermann durchgeführt. Den SchülerInnen wird damit aufgezeigt, wo ihre Stärken und Schwächen liegen. Außerdem kann mit individuellem Fördermaterial an den Schwächen gearbeitet werden.
