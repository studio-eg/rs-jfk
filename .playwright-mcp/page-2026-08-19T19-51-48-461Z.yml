    - heading "Schulprofil" [level=2] [ref=f2e23]
    - generic [ref=f2e25]:
      - generic [ref=f2e27]:
        - heading "Leitbild & Leitziele" [level=3] [ref=f2e28]
        - heading "Unser Leitbild" [level=4] [ref=f2e29]
        - paragraph [ref=f2e30]: Eigenverantwortliches und kooperatives Lernen und Arbeiten in einer gewaltfreien Schule, in der kein Platz für diskriminierende Äußerungen und Handlungen ist.
        - link [ref=f2e31] [cursor=pointer]:
          - /url: images/pic06.jpg
        - heading "Leitziele," [level=4] [ref=f2e33]
        - paragraph [ref=f2e34]: "die die Gesamtkonferenz (29.10.2018) nach Diskussion in schulinternen Gremien beschlossen hat:"
        - paragraph [ref=f2e35]:
          - strong [ref=f2e36]: "Leitziel 1:"
        - paragraph [ref=f2e37]: Wir achten die Vielfalt, die unsere Schülerinnen und Schüler durch ihre verschiedene Herkunft, Kultur, Religion und Begabung – als Spiegelbild der Gesellschaft – in unsere Schule einbringen. Wir respektieren die Individualität jedes Einzelnen und berücksichtigen unterschiedliche Lernvoraussetzungen, indem wir individuell fördern und fordern
        - paragraph [ref=f2e38]:
          - strong [ref=f2e39]: "Leitziel 2:"
        - paragraph [ref=f2e40]: Wir wollen eine Schule sein, in der durch respektvollen, wertschätzenden Umgang miteinander sowie engagierter Zusammenarbeit aller die Voraussetzung für eine vertrauensvolle Arbeitsatmosphäre geschaffen wird.
        - paragraph [ref=f2e41]:
          - strong [ref=f2e42]: "Leitziel 3:"
        - paragraph [ref=f2e43]: Wir wollen, dass jeder Verantwortung für sich und andere übernimmt und verbindliche Regeln und Pflichten beachtet, die notwendig sind, um ein gutes Miteinander in unserer Schulgemeinschaft zu ermöglichen.
        - paragraph [ref=f2e44]:
          - strong [ref=f2e45]: "Leitziel 4:"
        - paragraph [ref=f2e46]: Wir wollen unsere Schülerinnen und Schüler in ihrer Gesamtpersönlichkeit wahrnehmen, ihre Lernfreude erhalten und sie motivieren, Kreativität, Leistungsbereitschaft und Selbstständigkeit auszubauen.
        - paragraph [ref=f2e47]:
          - strong [ref=f2e48]: "Leitziel 5:"
        - paragraph [ref=f2e49]: Wir erziehen unsere Schülerinnen und Schüler dazu, die demokratischen Werte unserer Gesellschaft zu achten und zu bewahren sowie sich couragiert, tolerant und verantwortungsbewusst in unterschiedlichen Lebenssituationen zu verhalten.
        - paragraph [ref=f2e50]:
          - strong [ref=f2e51]: "Leitziel 6:"
        - paragraph [ref=f2e52]: Wir sichern und verbessern die Qualität des Unterrichts durch Fortbildungen der Lehrkräfte und durch Einbeziehung außerschulischer Lernorte sowie externer Fachleute in unsere Unterrichtsarbeit.
        - paragraph [ref=f2e53]:
          - strong [ref=f2e54]: "Leitziel 7:"
        - paragraph [ref=f2e55]: Wir bereiten die Schülerinnen und Schüler in allen Fächern auf die verschiedenartigen Anforderungen ihres späteren beruflichen und gesellschaftlichen Lebens vor, indem intensive Berufsorientierung, Methodenvielfalt, Medienkompetenz und musisch-kulturelle Bildung Schwerpunkte unserer schulischen Arbeit darstellen.
      - generic [ref=f2e57]:
        - generic [ref=f2e58]:
          - heading "Schulprogramm" [level=3] [ref=f2e59]
          - paragraph [ref=f2e60]: Im Schulprogramm legt die Schule in Grundsätzen fest, wie sie den Bildungsauftrag erfüllen will. Das Schulprogramm gibt darüber Auskunft, welches Leitbild und welche Entwicklungsziele die pädagogische Arbeit und die sonstigen Tätigkeiten der Schule bestimmen. Hierbei werden die Entwicklung zur inklusiven Schule, in der für alle Schülerinnen und Schüler des regionalen Umfelds ein barrierefreier und gleichberechtigter Zugang ermöglicht wird, die Zusammensetzung der Schülerschaft und die Struktur des regionalen Umfelds beachtet. Weiterhin enthält das Schulprogramm Aussagen über die Schritte zur Erreichung der angestrebten Ziele.
          - list [ref=f2e62]:
