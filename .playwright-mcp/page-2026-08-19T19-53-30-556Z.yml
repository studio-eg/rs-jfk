          - heading "Datenschutz in Videokonferenzen" [level=4] [ref=f11e38]
          - paragraph [ref=f11e39]:
            - text: An Videokonferenzen der Schule dürfen die betroffenen SchülerInnen teilnehmen. Es ist explizit
            - strong [ref=f11e40]: nicht erlaubt
            - text: ", dass andere Personen als die eingeladenen SchülerInnen, also auch nicht die Eltern, Geschwister, Freunde etc., an der Videokonferenz teilnehmen! Weiterhin weisen wir ausdrücklich auf die Vertraulichkeit dieser Videokonferenzen hin. Es dürfen keine Video-, Bild- oder Tonaufnahmen in irgendeiner Form von der Konferenz angefertigt werden. Die teilnehmenden SchülerInnen achten bitte auch darauf, dass nicht zufällig andere Personen (z.B. Familienmitglieder) gefilmt werden. Im Idealfall nehmen die SchülerInnen allein in einem separaten, ruhigen Raum an der Videokonferenz teil, um Störungen zu vermeiden."
          - paragraph [ref=f11e41]: Verstöße gegen diese Vorgaben werden gemeldet.
      - generic [ref=f11e43]:
        - heading "Bereitstellung der Website und Erstellung von Logfiles" [level=4] [ref=f11e44]
        - paragraph [ref=f11e45]: "Bei jedem Aufruf unserer Internetseite erfasst unser System automatisiert Daten und Informationen vom Computersystem des aufrufenden Rechners. Folgende Daten werden hierbei erhoben:"
        - list [ref=f11e46]:
          - listitem [ref=f11e47]: Datum und Uhrzeit des Zugriffes
          - listitem [ref=f11e48]: Die IP-Adresse des Nutzers
          - listitem [ref=f11e49]: Die Betriebssystemversion des Nutzers
          - listitem [ref=f11e50]: Der Browsertyp des Nutzers
          - listitem [ref=f11e51]: Die vom Nutzer aufgerufene Seite
        - paragraph [ref=f11e52]: Die Daten werden in den Logfiles unseres Systems gespeichert. Eine Speicherung dieser Daten zusammen mit anderen personenbezogenen Daten des Nutzers findet nicht statt. Zweck der Datenspeicherung ist die technische Optimierung unserer Internetseite. Rechtsgrundlage für die vorübergehende Speicherung der Daten ist Art. 6 Abs.1 lit.f DSGVO. Die Daten werden für zwei Monate gespeichert, sie werden lediglich statistisch ausgewertet.
        - heading "Cookies" [level=4] [ref=f11e53]
        - paragraph [ref=f11e54]: Die Internetseiten der Realschule John-F.-Kennedy-Platz verwenden Cookies. Cookies sind Textdateien, welche über einen Internetbrowser auf einem Computersystem abgelegt und gespeichert werden.
        - paragraph [ref=f11e55]: Zahlreiche Internetseiten und Server verwenden Cookies. Viele Cookies enthalten eine sogenannte Cookie-ID. Eine Cookie-ID ist eine eindeutige Kennung des Cookies. Sie besteht aus einer Zeichenfolge, durch welche Internetseiten und Server dem konkreten Internetbrowser zugeordnet werden können, in dem das Cookie gespeichert wurde. Dies ermöglicht es den besuchten Internetseiten und Servern, den individuellen Browser der betroffenen Person von anderen Internetbrowsern, die andere Cookies enthalten, zu unterscheiden. Ein bestimmter Internetbrowser kann über die eindeutige Cookie-ID wiedererkannt und identifiziert werden.
        - paragraph [ref=f11e56]: Durch den Einsatz von Cookies kann die Realschule John-F.-Kennedy-Platz den Nutzern dieser Internetseite nutzerfreundlichere Services bereitstellen, die ohne die Cookie-Setzung nicht möglich wären.
        - paragraph [ref=f11e57]: Mittels eines Cookies können die Informationen und Angebote auf unserer Internetseite im Sinne des Benutzers optimiert werden. Cookies ermöglichen uns, wie bereits erwähnt, die Benutzer unserer Internetseite wiederzuerkennen. Zweck dieser Wiedererkennung ist es, den Nutzern die Verwendung unserer Internetseite zu erleichtern. Der Benutzer einer Internetseite, die Cookies verwendet, muss beispielsweise nicht bei jedem Besuch der Internetseite erneut seine Zugangsdaten eingeben, weil dies von der Internetseite und dem auf dem Computersystem des Benutzers abgelegten Cookie übernommen wird.
        - paragraph [ref=f11e58]: Die durch diese Cookies verarbeiteten Daten sind für die genannten Zwecke zur Wahrung unserer berechtigten Interessen nach Art. 6 Abs. 1 S. 1 lit. f DSGVO erforderlich. Diese bestehen in einer technischen Optimierung der Bereitstellung unserer Internetseite.
        - paragraph [ref=f11e59]: Die betroffene Person kann die Setzung von Cookies durch unsere Internetseite jederzeit mittels einer entsprechenden Einstellung des genutzten Internetbrowsers verhindern und damit der Setzung von Cookies dauerhaft widersprechen. Ferner können bereits gesetzte Cookies jederzeit über einen Internetbrowser oder andere Softwareprogramme gelöscht werden. Dies ist in allen gängigen Internetbrowsern möglich. Deaktiviert die betroffene Person die Setzung von Cookies in dem genutzten Internetbrowser, sind unter Umständen nicht alle Funktionen unserer Internetseite vollumfänglich nutzbar.
        - heading "Speicherung personenbezogener Daten bei Kontaktaufnahme" [level=4] [ref=f11e60]
        - paragraph [ref=f11e61]: Sofern Sie per E-Mail den Kontakt mit uns aufnehmen, werden die von Ihnen übermittelten personenbezogenen Daten automatisch gespeichert. Diese Daten werden für Zwecke der Bearbeitung Ihres Anliegens und der Kontaktaufnahme mit Ihnen gespeichert. Die Löschung der Daten erfolgt, sobald deren Speicherung für die Bearbeitung Ihres Anliegens nicht mehr erforderlich ist.
        - heading "Betroffenenrechte" [level=4] [ref=f11e62]
        - paragraph [ref=f11e63]: "Sie können folgende Rechte geltend machen:"
        - paragraph [ref=f11e64]:
          - strong [ref=f11e65]: Auskunft/ Akteneinsicht
        - paragraph [ref=f11e66]: Gem. Art. 15 DSGVO haben Sie das Recht, Auskunft bzw. Akteneinsicht über die von uns verarbeiteten personenbezogenen Daten zu erhalten.
        - paragraph [ref=f11e67]:
          - strong [ref=f11e68]: Berichtigung
        - paragraph [ref=f11e69]: Sind bei uns gespeicherte personenbezogene Daten unrichtig oder unvollständig, haben Sie gem. Art. 16 DSGVO das Recht, diese berichtigen bzw. vervollständigen zu lassen.
        - paragraph [ref=f11e70]:
          - strong [ref=f11e71]: Löschung
        - paragraph [ref=f11e72]: Art. 17 DSGVO normiert das Recht auf Löschung personenbezogener Daten. Dieses Recht steht Ihnen insbesondere dann zu, wenn die Speicherung der personenbezogenen Daten zur Erfüllung unserer gesetzlichen Aufgaben nicht mehr erforderlich ist oder Sie Ihre Einwilligung zur Datenverarbeitung mit Wirkung für die Zukunft widerrufen haben.
        - paragraph [ref=f11e73]:
          - strong [ref=f11e74]: Einschränkung der Verarbeitung
        - paragraph [ref=f11e75]: Gem. Art. 18 DSGVO können Sie die Einschränkung der personenbezogenen Daten verlangen, wenn
        - list [ref=f11e76]:
          - listitem [ref=f11e77]: die Richtigkeit der Daten von Ihnen bestritten wird
          - listitem [ref=f11e78]: die Verarbeitung unrechtmäßig ist, Sie aber deren Löschung ablehnen
          - listitem [ref=f11e79]: wir die Daten nicht mehr benötigen, Sie jedoch diese zur Geltendmachung, Ausübung oder Verteidigung von Rechtsansprüchen benötigen
          - listitem [ref=f11e80]: oder Sie gemäß Art. 21 DSGVO Widerspruch gegen die Verarbeitung eingelegt haben
        - paragraph [ref=f11e81]:
          - strong [ref=f11e82]: Widerspruch
        - paragraph [ref=f11e83]: Sie können bei Gründen, die sich aus Ihrer besonderen Situation ergeben, ein Widerspruchsrecht geltend machen. Gem. Art. 21 DSGVO ist jedoch zu berücksichtigten, ob schutzwürdige Gründe für die Verarbeitung vorliegen oder die Verarbeitung der Geltendmachung, Ausübung oder Verteidigung von Rechtsansprüchen dient.
        - paragraph [ref=f11e84]:
          - strong [ref=f11e85]: Datenübertragbarkeit
        - paragraph [ref=f11e86]: Ist die Verarbeitung Ihrer Daten mit Hilfe eines automatisierten Verfahrens erfolgt, haben Sie gem. Art. 20 DSGVO das Recht, die Daten in einem gängigen und maschinenlesbaren Format zu erhalten und an eine andere Schule zu übermitteln bzw. durch uns übermitteln zu lassen.
        - paragraph [ref=f11e87]:
          - strong [ref=f11e88]: Widerruf der Einwilligung
        - paragraph [ref=f11e89]: Sie haben gem. Art. 7 Absatz 3 DSGVO das Recht, uns erteilte Einwilligungen jederzeit mit Wirkung für die Zukunft zu widerrufen.
        - paragraph [ref=f11e90]:
          - strong [ref=f11e91]: Beschwerde
        - paragraph [ref=f11e92]:
          - text: "Art. 77 DSGVO normiert ein Beschwerderecht bei der Aufsichtsbehörde. Die für uns zuständige Aufsichtsbehörde ist die Landesbeauftragte für den Datenschutz Niedersachsen, Prinzenstraße 5, 30159 Hannover. E-Mail:"
          - link "poststelle@lfd.niedersachsen.de" [ref=f11e93] [cursor=pointer]:
            - /url: mailto:poststelle@lfd.niedersachsen.de
        - paragraph [ref=f11e94]:
          - text: Teile dieser Datenschutzerklärung wurden durch den Datenschutzerklärungs-Generator der DGD Deutsche Gesellschaft für Datenschutz GmbH, die als
          - link "Externer Datenschutzbeauftragter Passau" [ref=f11e95] [cursor=pointer]:
            - /url: https://dg-datenschutz.de/datenschutz-dienstleistungen/externer-datenschutzbeauftragter/
          - text: tätig ist, in Kooperation mit dem
          - link "Anwalt für Datenschutzrecht" [ref=f11e96] [cursor=pointer]:
            - /url: https://www.wbs-law.de/it-recht/datenschutzrecht
          - text: Christian Solmecke erstellt.
