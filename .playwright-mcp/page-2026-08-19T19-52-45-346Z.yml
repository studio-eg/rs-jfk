        - heading "Fachbereiche" [level=3] [ref=f3e28]
        - paragraph [ref=f3e29]: "Zum Pflichtunterricht einer Realschule gehören folgende Fächer, die jeweils in verschiedene Fachbereiche gegliedert sind:"
        - list [ref=f3e30]:
          - listitem [ref=f3e31]: "Sprachen: Deutsch, Englisch"
          - listitem [ref=f3e32]: "Mathematik-Naturwissenschaften: Mathematik, Physik, Chemie, Biologie"
          - listitem [ref=f3e33]: "Geschichtlich-soziale Weltkunde: Geschichte, Erdkunde, Politik"
          - listitem [ref=f3e34]: "Arbeit/Wirtschaft - Technik: Wirtschaft (ab dem 8. Schuljahrgang), Technik und Hauswirtschaft ( im 8. Schuljahrgang)"
          - listitem [ref=f3e35]: "Musisch-kulturelle Bildung: Musik, Kunst, Gestaltendes Werken, Textiles Gestalten"
          - listitem [ref=f3e36]: Religion / Werte und Normen
          - listitem [ref=f3e37]: Sport
        - list [ref=f3e39]:
          - listitem [ref=f3e40]:
            - link "Mehr erfahren" [ref=f3e41] [cursor=pointer]:
              - /url: fachbereiche.html
      - separator [ref=f3e42]
      - generic [ref=f3e43]:
        - heading "Wahlpflichtkurse" [level=3] [ref=f3e44]
        - paragraph [ref=f3e45]: Der Unterricht in der Realschule besteht aus Pflichtunterricht sowie aus Angeboten im Wahlpflichtunterricht und im wahlfreien Unterricht. Eine zweite Fremdsprache (in der Regel Französisch) wird als vierstündiger Wahlpflichtkurs ab dem 6. Schuljahrgang angeboten. Schülerinnen und Schüler, die das Angebot der zweiten Fremdsprache nicht wählen, erhalten Unterricht in zwei jeweils zweistündigen anderen Wahlpflichtkursen. Das Erlernen der zweiten Fremdsprache ab dem 6. Schuljahrgang ist nicht Voraussetzung für einen möglichen Übergang in die Einführungsphase der gymnasialen Oberstufe oder für den Besuch des beruflichen Gymnasiums. Neben der 2. Fremdsprache bieten wir in den Schuljahrgängen 9 und 10 im Wahlpflichtbereich die Profile Wirtschaft, Technik und Gesundheit und Soziales an.
        - list [ref=f3e47]:
          - listitem [ref=f3e48]:
            - link "Mehr erfahren" [ref=f3e49] [cursor=pointer]:
              - /url: wpk.html
      - separator [ref=f3e50]
      - generic [ref=f3e51]:
        - heading "Arbeitsgemeinschaften" [level=3] [ref=f3e52]
        - paragraph [ref=f3e53]: In Arbeitsgemeinschaften können die Schülerinnen und Schüler Dinge lernen, die sie persönlich besonders interessieren, zum Beispiel Theater oder Basketball spielen.
        - list [ref=f3e55]:
          - listitem [ref=f3e56]:
            - link "Mehr erfahren" [ref=f3e57] [cursor=pointer]:
              - /url: ag.html
      - separator [ref=f3e58]
      - generic [ref=f3e59]:
        - heading "Berufsorientierung" [level=3] [ref=f3e60]
        - paragraph [ref=f3e61]: Berufsorientierende Maßnahmen werden als Praxistage an mindestens insgesamt 30 Schultagen vorrangig in den Schuljahrgängen 8 bis 10 durchgeführt. Im 8. Schuljahrgang dienen sie u.a. der Vorbereitung auf die Profilwahl im 9. und 10. Schuljahrgang. Die Zusammenarbeit mit der Berufsberatung der Arbeitsverwaltung, den Kammern, Unterricht in Kooperation mit berufsbildenden Schulen und Praxiserfahrungen in Betrieben oder in anderen Einrichtungen sind Teil des fächerübergreifenden schulischen Konzepts zur Durchführung berufsorientierender Maßnahmen.
        - list [ref=f3e63]:
          - listitem [ref=f3e64]:
            - link "Mehr erfahren" [ref=f3e65] [cursor=pointer]:
              - /url: bo.html
