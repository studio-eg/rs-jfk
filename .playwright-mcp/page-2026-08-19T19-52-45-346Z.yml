        - paragraph [ref=f3e69]: "In Anlehnung an das \"Braunschweiger Modell\" zur Gewaltprävention wird an unserer Schule ein Präventionsprojekt in mehreren Stufen durchgeführt:"
        - list [ref=f3e70]:
          - listitem [ref=f3e71]: "\"Lions Quest\" in Klasse 5 - 7"
          - listitem [ref=f3e72]: "\"Schritte gegen Tritte\" in allen 7. Klassen"
          - listitem [ref=f3e73]: Antigewalttraining in allen 8. Klassen
          - listitem [ref=f3e74]: Konfliktlotsenintensivschulung für Schüler/- innen ab Klasse 8
