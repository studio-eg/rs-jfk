      - heading "Anmeldungen Klasse 6 - 10" [level=4] [ref=f22e52]
      - paragraph [ref=f22e53]: Sollten Sie Ihren Sohn / Ihre Tochter an unserer Schule für Jahrgang 6 – 10 anmelden wollen, stellen wir Ihnen hier ein Anmeldeformular zur Verfügung.
      - paragraph [ref=f22e54]: Wir müssen Sie bereits jetzt darauf hinweisen, dass wir leider nur sehr begrenzt freie Schulplätze in den oberen Jahrgängen anbieten können. Wir arbeiten daher mit einer Vormerkliste. Bitte melden Sie ihr Kind nur an EINER Realschule (Erstwunsch) an. Sie haben auf dem Anmeldeformular die Möglichkeit, einen Zweit- und Drittwunsch anzugeben.
      - paragraph [ref=f22e55]: Um sich vormerken zu lassen, benötigen wir von Ihnen das Anmeldeformular, das letzte Zeugnis in Kopie sowie einen Überweisungsbeschluss der abgebenden Schule. Der Überweisungsbeschluss kann nachgereicht werden. Bei Wechsel von der IGS benötigen wir zusätzlich ein Notenzeugnis. Bei Wechsel von einer Braunschweiger Realschule, setzen Sie sich bitte vorab mit der jeweiligen Schulleitung in Verbindung.
      - paragraph [ref=f22e56]: Nach unseren Zensurenkonferenzen in Kalenderwoche 26 setzt sich die aufnehmende Schule mit Ihnen in Verbindung. Wir bitten Sie, von telefonischen Anfragen abzusehen.
      - paragraph [ref=f22e57]:
