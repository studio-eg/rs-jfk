        - heading "Infoabend für Grundschüler" [level=4] [ref=f22e123]
        - paragraph [ref=f22e124]: Für alle interessierten Grundschüler bietet sich am 21. April die Möglichkeit, unsere Schule kennenzulernen.
        - paragraph [ref=f22e125]: In der Zeit von 16:30 bis 18:30 Uhr bietet die Schule den Kindern und Eltern einen Einblick in unseren Schulalltag. Angeboten werden Führungen mit verschiedenen Stationen, bei denen zum Mitmachen und Beobachten eingeladen wird.
        - text: Schüler und Lehrer bereiten traditionell viele Aktionen und Informationen in den Klassen- und Fachräumen und auch auf dem Schulhof vor. Darüber hinaus wird der Schulelternverein über seine Arbeit informieren. Für das leibliche Wohl wird gesorgt.
