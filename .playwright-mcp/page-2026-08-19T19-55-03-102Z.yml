            - /url: images/buchzimmer.jpg
          - heading "Kunstprojekt „Buchzimmer“ - Kreativität auf hohem Niveau" [level=4] [ref=f22e145]
          - paragraph [ref=f22e146]: "Die Klassen 5a, 6b und 7c haben im Rahmen des Kunstunterrichts an einem besonderen Projekt gearbeitet: Es galt, ein kreatives Buchzimmer zu gestalten - ein Raum im Miniaturformat, inspiriert von der Welt der Bücher."
          - paragraph [ref=f22e147]:
            - text: Aus den vielfältigen und ideenreichen Ergebnissen wurde im Rahmen eines schulinternen Wettbewerbs eine Bewertung vorgenommen. Drei besonders gelungene Objekte wurden zu unseren Schulgewinnern gekürt (
            - link "siehe Bilder" [ref=f22e148] [cursor=pointer]:
              - /url: files/buchzimmer.pdf
            - text: "). Eines der Kunstwerke wird sogar beim Niedersächsischen Schulbibliothekswettbewerb eingereicht - wir drücken die Daumen! Wer die fantasievollen Buchzimmer einmal selbst sehen möchte: Viele der tollen Objekte sind derzeit im Nawigang in der Vitrine ausgestellt und laden zum Staunen ein."
          - paragraph [ref=f22e149]:
            - link "Infos zum Wettbewerb ansehen" [ref=f22e150] [cursor=pointer]:
              - /url: https://www.alf-hannover.de/schulbibliothekswettbewerb-2025
          - heading "Die SV-Lehrkräfte stellen sich vor" [level=4] [ref=f22e151]
          - paragraph [ref=f22e152]: SV-Lehrkräfte beraten und unterstützen die Schülervertretung und tragen aktiv zur Förderung demokratischer Prozesse und Partizipation in der Schule bei. Wir freuen uns daher ganz besonders, dass Herr Werner und Frau Haybat dieses wichtige Amt übernommen haben.
          - paragraph [ref=f22e153]:
            - link "Schreiben der SV-Lehrkräfte ansehen" [ref=f22e154] [cursor=pointer]:
              - /url: files/sv-lehrkraefte.pdf
          - img "Spendenscheck - Weggefährten e. V." [ref=f22e156]
          - heading "Spende an den Verein Weggefährten e. V." [level=4] [ref=f22e157]
          - paragraph [ref=f22e158]:
            - emphasis [ref=f22e159]: Ein Bericht der Schülervertretung der Realschule John-F.-Kennedy-Platz
          - paragraph [ref=f22e160]:
            - text: "Wir, die Schülervertretung der Realschule am John-F.-Kennedy-Platz, haben am 6. Mai ein Frühlingsfest organisiert, um die kulturelle Vielfalt unserer Schule zu feiern, um unsere Schulgemeinschaft näher zusammenzubringen. Es war ein buntes, fröhliches Fest mit Musik, leckerem Essen und vielen tollen Aktionen - ein Tag, der gezeigt hat, wie viel Herz, Engagement und Zusammenhalt in unserer Schule steckt. Ein besonderes Highlight war unsere Tombola, die wir als Schülervertretung mit viel Einsatz auf die Beine gestellt haben. Zahlreiche Gewinne wurden von lokalem Unterstützer*innen gespendet und sorgten für große Freude - und haben gleichzeitig etwas viel Größeres ermöglicht: eine gemeinsame Spendenaktion für einen guten Zweck. Denn uns war von Anfang an klar: Der Erlös aus der Tombola soll helfen. Helfen dort, wo Unterstützung und Hoffnung dringend gebraucht werden."
            - strong [ref=f22e161]: Deshalb spenden wir den gesamten Betrag von 293,31 Euro an den Verein Weggefährten e. V. Braunschweig, der sich liebevoll und engagiert um krebskranke Kinder und ihre Familien kümmert.
            - text: Mit dieser Spende möchten wir zeigen, dass Schule mehr sein kann als Unterricht - nämlich ein Ort, an dem Mitgefühl gelebt und Verantwortung übernommen wird. Wir sind stolz, dass unsere Aktion nicht nur Freude gebracht, sondern auch Hoffnung geschenkt hat. Danke an alle, die mitgemacht, gespendet und unterstützt haben. Gemeinsam haben wir etwas bewegt.
          - paragraph [ref=f22e162]: Eure Schülervertretung Realschule John-F.-Kennedy-Platz
          - list [ref=f22e163]:
            - listitem [ref=f22e164]:
              - link "Übergabe der Spendenurkunde" [ref=f22e165] [cursor=pointer]:
                - /url: images/weggefaehrten_treffenvorort.jpg
            - listitem [ref=f22e166]:
              - link "Spendenurkunde ansehen" [ref=f22e167] [cursor=pointer]:
                - /url: files/spendenurkunde_weggefaehrten.pdf
          - img "Stolpersteine in Braunschweig - Putzaktion 2025" [ref=f22e169]
          - heading "Stadtweite Putzaktion der Stolpersteine zum 80. Jahrestag der Befreiung vom Nazi-Regime" [level=4] [ref=f22e170]
          - paragraph [ref=f22e171]: Am 8. Mai wurden in ganz Braunschweig Stolpersteine geputzt. Auch unsere Schule, die sich seit vielen Jahren in Zusammenarbeit mit dem Verein „Stolpersteine für Braunschweig“ durch Recherchen und Präsentation selbiger im Roten Saal gegen das Vergessen einsetzt, nahm daran teil. Dabei wurden die Steine poliert und die Geschichte der Opfer des Nazi-Regimes vorgetragen. Die Schüler gedachten dabei unter anderem der fünfköpfigen Familie Bremer, die einst in der Wolfenbüttler Straße lebten und wie viele andere Familien mit teilweise jüdischen Wurzeln dem Terror und der Verfolgung ausgesetzt waren. Im Anschluss legten die Schülerinnen und Schüler Blumen um die polierten Steine.
          - heading "Bonjour Paris! - Die unvergessliche Reise des Französisch-Profilkurses 9 –" [level=4] [ref=f22e172]
          - paragraph [ref=f22e173]:
            - text: "Fünf Tage voller Abenteuer, Kultur und neuen Freundschaften: Unser Französisch-Profilkurs machte sich im März 2025 gemeinsam mit Schüler*innen der Nibelungenrealschule auf den Weg in die Stadt der Lichter – Paris! ..."
            - link "Vollständigen Bericht lesen" [ref=f22e174] [cursor=pointer]:
              - /url: files/paris.pdf
          - img "Vorstellung Phase BE" [ref=f22e176]
          - paragraph [ref=f22e177]:
            - strong [ref=f22e178]: Sommerakademie Braunschweig 2025 – eine Kooperation der Bürgerstiftung Braunschweig und der Phase BE
          - paragraph [ref=f22e179]: "Einen attraktiven Beitrag zur Berufsorientierung bietet die Sommerakademie. Herr Merah (Phase BE) besuchte unsere Schülerinnen und Schüler, um die Sommerakademie vorzustellen. Und darum geht es:"
          - paragraph [ref=f22e180]:
            - strong [ref=f22e181]: 3 Wochen Sommercamp und 1 Jahr weitere Begleitung für deine berufliche Zukunft.
          - paragraph [ref=f22e182]: In drei Wochen Sommerferien geht es um Kompetenzen, Interessen und Entwicklung. Highlights sind der Berufspraxistag, Bewerbungsgespräche mit Unernehmensvertreter:innen und ein fachkundig angeleitetes Musical-Projekt. Berufsorientierung, schulisches Lernen und Kreativität greifen über alle Module hinweg ineinander.
          - paragraph [ref=f22e183]: "Im neuen Schuljahr treffen sich alle Sommercamp-Teilnehmer:innen bis zum nächsten Sommer wöchentlich in Kleingruppen und regelmäßig auch in der Gesamtgruppe für besondere Aktivitäten. Schulische Herausforderungen, persönliche Themen und laufende Bewerbungsprozese werden so in der Gemeinschaft und auch in individuellen Settings unterstützt. Klares Ziel: Nachhaltige Unterstützung bei den nächsten Schritten ins Berufsleben."
          - paragraph [ref=f22e184]:
            - text: Du hast Interesse teilzunehmen?
            - link "Dann bewirb dich jetzt!" [ref=f22e185] [cursor=pointer]:
              - /url: https://www.phasebe.de/die-sommerakademie
          - img "Präventionsprojekt LARS & LISA" [ref=f22e187]
          - heading "LARS & LISA wieder an der Realschule John-F.-Kennedy-Platz" [level=4] [ref=f22e188]
          - paragraph [ref=f22e189]:
            - text: Wir freuen uns sehr, dass das von der Stadt Braunschweig geförderte Präventionsprojekt
            - strong [ref=f22e190]: „LARS & LISA – Lust an realistischer Sicht und Leichtigkeit im sozialen Alltag“
            - text: erneut an unserer Schule durchgeführt wird – diesmal in der Klasse
            - strong [ref=f22e191]: 8b
            - text: .
          - paragraph [ref=f22e192]:
            - text: Mit dem Projekt reagiert die Realschule John-F.-Kennedy-Platz auf die Ergebnisse der
            - strong [ref=f22e193]: CTC-Jugendbefragung (Communities That Care)
            - text: aus dem Jahr 2022, die unter anderem den Bedarf an Maßnahmen zur Förderung psychischer Gesundheit bei Jugendlichen verdeutlichte.
            - strong [ref=f22e194]: Ziel des Programms
            - text: ist es, die psychosoziale Kompetenz der Schüler*innen zu stärken und ihnen Werkzeuge mitzugeben, die für das ganze Leben von Bedeutung sind – insbesondere im Bereich der
            - strong [ref=f22e195]: Resilienz
            - text: ", also der seelischen Widerstandskraft. In"
            - strong [ref=f22e196]: zehn Doppelstunden
            - text: "werden unter anderem folgende Themen behandelt:"
          - list [ref=f22e197]:
            - listitem [ref=f22e198]: Wie setze ich mir sinnvolle Ziele – und wie erreiche ich sie?
            - listitem [ref=f22e199]: Was ist der Zusammenhang zwischen Gedanken, Gefühlen und Verhalten?
            - listitem [ref=f22e200]: Wie erkenne ich negative Denkmuster – und wie kann ich sie in positive umwandeln?
            - listitem [ref=f22e201]: Was bedeutet selbstsicheres Verhalten – und wie lässt es sich trainieren?
            - listitem [ref=f22e202]: Wie kann ich besser mit anderen in Kontakt kommen?
          - paragraph [ref=f22e203]: "Begleitet wird das Training von zwei speziell geschulten Trainer*innen: Eine Studentin der Sozialpädagogik sowie unsere Schulsozialarbeiterin Frau Meyer führen das Programm durch. Dieses wird sich über einen Zeitraum von rund drei Monaten erstrecken."
          - paragraph [ref=f22e204]: Wir wünschen unseren Schüler*innen eine bereichernde und stärkende Zeit mit LARS & LISA!
          - link [ref=f22e205] [cursor=pointer]:
            - /url: images/fruehling.jpg
          - heading "Das Projekt \"Schulgarten\"" [level=4] [ref=f22e207]
          - paragraph [ref=f22e208]: Vor einem knappen Jahr initiierte unser Konrektor Herr Müller die Neugestaltung des Schulgartens. Dank der Beratung durch Herrn Schebesta von der Bürgerstiftung, der tollen Planung durch den Fachbereich Stadtgrün und der tatkräftigen Unterstützung von unserem Hausmeister Herrn Fuhl haben nun der WPK Schulgarten unter der Leitung von Frau Ammann und die Schülerinnen und Schüler, die am Werken-Unterricht teilnehmen, eine tolle Grundlage für kreative Outdoor-Ideen.
          - paragraph [ref=f22e209]:
            - link "Bilder ansehen" [ref=f22e210] [cursor=pointer]:
              - /url: files/schulgarten.pdf
          - link [ref=f22e212] [cursor=pointer]:
            - /url: images/stadtputz2025.JPEG
            - img "Teilnahme der 8 a am Stadtputztag" [ref=f22e213]
          - heading "Stadtputztag 2025" [level=4] [ref=f22e214]
          - paragraph [ref=f22e215]: Auch in diesem Jahr fand in Braunschweig wieder der Stadtputztag statt. Wir freuen uns ganz besonders über das Engagement der Klasse 8 a unter der Leitung von Frau Amelsberg.
          - heading "Berufsmesse" [level=4] [ref=f22e216]
          - paragraph [ref=f22e217]:
            - text: Am 27.03. fand unsere hausinterne Berufsmesse statt. Hier stellten sich Firmen, die Ausbildungsplätze anbieten, vor. Einen Eindruck von der Messe gibt es
            - link "hier" [ref=f22e218] [cursor=pointer]:
              - /url: files/berufsmesse_2025.pdf
            - text: .
          - link [ref=f22e219] [cursor=pointer]:
            - /url: images/tulpen_pflanzen.jpg
          - heading "Tulpen für Brot – WPK Schulgarten hilft mit" [level=4] [ref=f22e221]
          - paragraph [ref=f22e222]: "Im Herbst erhielten die Schülerinnen und Schüler des WPK Schulgartens eine besondere Lieferung: Tulpenzwiebeln aus Holland, die sie in der darauffolgenden Pausen verkauften und einen großartigen Erlös von 130 Euro sammelten. Die restlichen Tuplenzwiebeln pflanzten sie gemeinsam im Schulgarten an. Das gesammelte Geld kommt gleich drei wichtigen Hilfsorganisationen zugute:"
          - list [ref=f22e223]:
            - listitem [ref=f22e224]: BOS Deutschland e.V. unterstützt in zwei Rettungszentren auf Borneo über 400 Orang-Utans und engagiert sich für den Schutz des Regenwaldes.
            - listitem [ref=f22e225]: UNICEF Deutschland hilft mit Spezialnahrung und weiteren Maßnahmen Kindern in Krisengebieten, damit sie wieder gesund und stark werden können.
            - listitem [ref=f22e226]: Die Deutsche KinderKrebshilfe setzt sich für die Erforschung von Krebserkrankungen, die Verbesserung der Behandlung und die Förderung der Nachsorge für betroffene Kinder ein.
          - paragraph [ref=f22e227]: Aktuell verkaufen die Schülerinnen und Schüler Pflanztöpfe mit den bereits gewachsenen Tulpen. Jeder kann sihc beim Kauf eine blühend eÜberraschung freuen. Eine wunderschöne Aktion, die sowohl den Schulgarten verschönert als auch einen wertvollen Beitrag zu wichtigen Hilfsprojekten leistet.
          - heading "Braunschweiger Zeitung schreibt zum Handyverbot an unserer Schule" [level=4] [ref=f22e228]
          - paragraph [ref=f22e229]: Seit letztem Jahr gilt ein Handyverbot an unserer Schule. Dieses wurde von Herrn Müller in Absprache mit der SV und dem Schulelternrat initiiert und von der Gesamtkonferenz beschlossen. Wir haben sehr gute Erfahrungen damit gemacht und freuen uns über eine Schülerschaft, die im Gespräch bleibt.
          - paragraph [ref=f22e230]:
            - link "Artikel in der Braunschweiger Zeitung lesen" [ref=f22e231] [cursor=pointer]:
              - /url: files/Braunschweiger_Zeitung_Handyverbot.pdf
          - heading "Neue Schulleitung" [level=4] [ref=f22e232]
          - paragraph [ref=f22e233]: Seit Beginn des Halbjahres wird die Schule von Sabine Schawe geleitet. Gemeinsam mit dem Konrektor, Herrn Müller, den Lehrkräften, Mitarbeiter:innen und der Schülervertretung wird sie sich für das Wohl der Schule und der Schulgemeinschaft engagieren.
          - paragraph [ref=f22e234]:
            - link "Artikel in der Braunschweiger Zeitung ansehen" [ref=f22e235] [cursor=pointer]:
              - /url: images/bz_15032025.png
          - link [ref=f22e237] [cursor=pointer]:
            - /url: images/bootsanleger2025.jpg
            - img "Der sanierte Bootsanleger" [ref=f22e238]
          - heading "Bootsanleger der Schule saniert" [level=4] [ref=f22e239]
          - paragraph [ref=f22e240]: Wir freuen uns über unseren sanierten Bootsanleger. Vielen Dank an die Stadt Braunschweig und unseren Hausmeister Herrn Fuhl.
          - heading "Bericht zum 110-jährigen Jubiläum des Schulgebäudes" [level=4] [ref=f22e241]
          - paragraph [ref=f22e242]:
            - text: Der ehemalige Lehrer Henning Habekost hat uns freundlicherweise einen Bericht zum 110-jährigen Jubiläum des Schulgebäudes (2024) zur Verfügung gestellt. Wir freuen uns sehr über diese informative und mit vielen Bildern versehene Lektüre und haben sie auf unserer Seite
            - link "Chronik" [ref=f22e243] [cursor=pointer]:
              - /url: files/110Jahre_JFK-Gebaeude.pdf
            - text: veröffentlicht.
          - link [ref=f22e245] [cursor=pointer]:
            - /url: images/aidshilfe.jpg
            - img "SV sammelt für AIDS-Hilfe" [ref=f22e246]
          - heading "SV sammelt für AIDS-Hilfe" [level=4] [ref=f22e247]
          - paragraph [ref=f22e248]: Unsere SV hat auch in diesem Jahr für die AIDS-Hilfe gesammelt. Insgesamt konnten über 160,17 Euro gespendet werden. Vielen Dank für euer Engagement!
          - paragraph [ref=f22e249]:
            - link "Dankschreiben der AIDS-Hilfe ansehen" [ref=f22e250] [cursor=pointer]:
              - /url: files/dankschreiben_wat2024.pdf
          - heading "Team der Schule gewinnt 1. Preis in der MINT-Liga" [level=4] [ref=f22e251]
          - paragraph [ref=f22e252]: Mit Hilfe der MINT Liga sollen Kinder und Jugendliche für außerschulische MINT Angebote begeistert werden. Das „Verbundprojekt Zukunftsliga MINT – MINT-Liga“ wird in den Jahren 2022 bis 2025 von der Haus der Wissenschaft Braunschweig GmbH gemeinsam mit dem Institut für Fachdidaktik der Naturwissenschaften (IFdN) der Technischen Universität Braunschweig, der phaeno gGmbH und den Codenauten durchgeführt und vom Bundesministerium für Bildung und Forschung (BMBF) gefördert.
          - paragraph [ref=f22e253]: Unsere Schülerinnen und Schüler haben als Team an der MINT-Liga teilgenommen und verschiedenste Experimente durchgeführt, z. B. einen Wasser-Filter aus Naturmaterialien und eine Wasserdruck-Rakete bauen, eine Geheimschrift mit Farbfiltern erstellen, einen "Um-die-Ecken-Gucker" und ein mit Teelicht betriebenes Boot bauen, Mini Seifenkisten konstruieren und ein Fernglas aus Chipstüten erstellen. Dabei haben sie viel gelernt und waren mit Spaß dabei. Herzlichen Glückwunsch an alle, die mitgemacht haben!
          - paragraph [ref=f22e254]:
            - link "Homepage MINT-Liga" [ref=f22e255] [cursor=pointer]:
              - /url: https://mintliga.de
