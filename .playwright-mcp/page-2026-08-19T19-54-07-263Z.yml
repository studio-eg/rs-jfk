      - heading "Basketball" [level=4] [ref=f15e65]
      - paragraph [ref=f15e66]: Dank der Unterstützung durch die Herbert Balke-Stiftung kann seit dem 5. Februar 2024 eine Basketball-AG an unserer Schule angeboten werden. Immer montags in der Zeit von 13:30 – 15:00 Uhr trainieren 20 Schüler*innen der Jahrgänge 7 – 9 mit Unterstützung eines hauptamtlichen Trainers der SG Braunschweig in der Turnhalle der Schule. Neben der Heranführung an den Basketballsport und eine Begeisterung für diesen zu entwickeln steht vor allem die Vermittlung von positiven Grundwerten (Fairplay, Toleranz, Verlässlichkeit und Engagement) im Mittelpunkt. Wir sind glücklich, mit der SG Braunschweig einen professionellen und zuverlässigen Partner zu haben.
