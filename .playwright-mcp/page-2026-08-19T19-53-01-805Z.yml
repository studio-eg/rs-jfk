      - generic [ref=f5e28]:
        - heading "Schulleitung" [level=4] [ref=f5e29]
        - paragraph [ref=f5e30]: Jede Schule hat eine Schulleiterin oder einen Schulleiter, die oder der die Gesamtverantwortung für die Schule und für deren Qualitätssicherung und Qualitätsentwicklung trägt. Die Schulleiterin ist Vorgesetzte und der Schulleiter ist Vorgesetzter aller an der Schule tätigen Personen, besucht und berät die an der Schule tätigen Lehrkräfte im Unterricht und trifft Maßnahmen zur Personalwirtschaft einschließlich der Personalentwicklung. Sie oder er sorgt für die Einhaltung der Rechts- und Verwaltungsvorschriften und der Schulordnung.
        - list [ref=f5e32]:
          - listitem [ref=f5e33]:
            - link "Mehr erfahren" [ref=f5e34] [cursor=pointer]:
              - /url: schulleitung.html
      - separator [ref=f5e35]
      - generic [ref=f5e36]:
        - heading "Verwaltung" [level=4] [ref=f5e37]
        - paragraph [ref=f5e38]: Schulsekretärinnen sind für die Erledigung des Verwaltungs- und des Schreibdienstes in allen Schulangelegenheiten zuständig. Die Aufgaben der Schulleitung und der Schulsekretärinnen sind eng miteinander verknüpft.
        - paragraph [ref=f5e39]: Schulassistentinnen und Schulassistenten unterstützen die Lehrkräfte bei der Vorbereitung und Durchführung des Unterrichts, entlasten sie von Tätigkeiten, die sonst von Lehrkräften neben der eigentlichen Unterrichtstätigkeit wahrzunehmen sind, und wirken bei schulischen Maßnahmen und Veranstaltungen mit.
        - paragraph [ref=f5e40]: Schulhausmeister kennen sich in ihrer Schule bestens aus. Sie übernehmen die Kontrolle der haustechnischen Anlagen, führen Wartungs- / Instandhaltungsarbeiten aus, übernehmen Kleinreparaturen in verschiedenen Gewerken, sorgen für die Instandhaltung von Außenanlagen- Grün und Gartenanlagen, wirken im Rahmen des Qualitätsmanagement der Schule mit u. v. m.
        - list [ref=f5e42]:
          - listitem [ref=f5e43]:
            - link "Mehr erfahren" [ref=f5e44] [cursor=pointer]:
              - /url: verwaltung.html
      - separator [ref=f5e45]
      - generic [ref=f5e46]:
        - heading "Schulvorstand" [level=4] [ref=f5e47]
        - paragraph [ref=f5e48]: Im Schulvorstand wirken der Schulleiter oder die Schulleiterin mit Vertreterinnen oder Vertretern der Lehrkräfte, der Erziehungsberechtigten sowie der Schülerinnen und Schüler zusammen, um die Arbeit der Schule mit dem Ziel der Qualitätsentwicklung zu gestalten.
        - paragraph [ref=f5e49]: Die Schulleiterin oder der Schulleiter unterrichtet den Schulvorstand über alle wesentlichen Angelegenheiten der Schule, insbesondere über die Umsetzung des Schulprogramms sowie den Stand der Verbesserungsmaßnahmen nach § 32 Abs. 3.
      - separator [ref=f5e50]
      - generic [ref=f5e51]:
        - heading "Lehrerkollegium" [level=4] [ref=f5e52]
        - paragraph [ref=f5e53]: Die Lehrkräfte erziehen und unterrichten in eigener pädagogischer Verantwortung. Sie sind an Rechts- und Verwaltungsvorschriften, Entscheidungen der Schulleiterin oder des Schulleiters oder der kollegialen Schulleitung, Beschlüsse des Schulvorstands, Beschlüsse der Konferenzen und deren Ausschüsse nach § 39 Abs. 1, Beschlüsse der Bildungsgangs- und Fachgruppen sowie an Anordnungen der Schulaufsicht gebunden.
        - paragraph [ref=f5e54]: Die Lehrkräfte an den öffentlichen Schulen stehen in einem unmittelbaren Dienstverhältnis zum Land. Für die Erteilung von Religionsunterricht können Bedienstete der Religionsgemeinschaften des öffentlichen Rechts und deren öffentlich-rechtlicher Verbände, Anstalten und Stiftungen beschäftigt werden.
        - list [ref=f5e56]:
          - listitem [ref=f5e57]:
            - link "Mehr erfahren" [ref=f5e58] [cursor=pointer]:
              - /url: lehrkraefte.html
      - separator [ref=f5e59]
      - generic [ref=f5e60]:
        - heading "Kommunale Schulsozialarbeit & Beratung" [level=4] [ref=f5e61]
        - paragraph [ref=f5e62]: Kommunale Schulsozialarbeit hat sich zum Ziel gemacht, Chancengleichheit herzustellen und jeder*m Schüler*in durch individuelle Einzelfallhilfe die Möglichkeit zu bieten, einen für sich guten Schulabschluss zu erlangen. Dabei sollen Hindernisse, die einen erfolgreichen Schulabschluss gefährden, wie Migrationshintergrund, ein bildungsfernes Elternhaus, das Aufwachsen bei einem alleinerziehenden Elternteil sowie Armut, ausgeräumt werden.
        - paragraph [ref=f5e63]: Die Beratungslehrerin kooperiert mit der Schulsozialarbeiterin und bildet mit ihr zusammen das Beratungsteam. Sie moderiert die Beratungskonferenz, erstellt und entwickelt mit dieser das Beratungskonzept weiter. Darüber hinaus arbeitet sie in einem kooperativen Netzwerk mit allen intern wie extern an Beratung der Schule Beteiligten zusammen und pflegt den Austausch und Kontakt zu den externen Beratungs- und Präventionseinrichtungen der Stadt Braunschweig.
        - list [ref=f5e65]:
          - listitem [ref=f5e66]:
            - link "Mehr erfahren" [ref=f5e67] [cursor=pointer]:
              - /url: soziales.html
      - separator [ref=f5e68]
      - generic [ref=f5e69]:
        - heading "Schülervertretung" [level=4] [ref=f5e70]
        - paragraph [ref=f5e71]: Schülerinnen und Schüler wirken in der Schule mit durch
        - list [ref=f5e72]:
          - listitem [ref=f5e73]: Klassenschülerschaften sowie Klassensprecherinnen und Klassensprecher,
          - listitem [ref=f5e74]: den Schülerrat sowie Schülersprecherinnen und Schülersprecher,
          - listitem [ref=f5e75]: Vertreterinnen und Vertreter in Konferenzen, Ausschüssen und im Schulvorstand.
        - paragraph [ref=f5e76]: Die Mitwirkung soll zur Erfüllung des Bildungsauftrags der Schule (§2) beitragen.
      - separator [ref=f5e77]
      - generic [ref=f5e78]:
        - heading "Schulelternrat" [level=4] [ref=f5e79]
        - paragraph [ref=f5e80]: Die Vorsitzenden der Klassenelternschaften bilden den Schulelternrat. Der Schulelternrat wählt die Elternratsvorsitzende oder den Elternratsvorsitzenden und eine Stellvertreterin oder einen Stellvertreter oder mehrere Stellvertreterinnen oder Stellvertreter aus seiner Mitte sowie die Vertreterinnen oder Vertreter und eine gleiche Anzahl von Stellvertreterinnen oder Stellvertretern in der Gesamtkonferenz, in den Teilkonferenzen, außer denen für organisatorische Bereiche, und in den entsprechenden Ausschüssen.
        - paragraph [ref=f5e81]: Die oder der Vorsitzende lädt den Schulelternrat mindestens zweimal im Jahr zu einer Sitzung ein.
      - separator [ref=f5e82]
      - generic [ref=f5e83]:
        - heading "Schulelternverein" [level=4] [ref=f5e84]
        - paragraph [ref=f5e85]: Der Schulelternverein hilft bei der Ausstattung unserer Schule mit Lehrmitteln, unterstützt bedürftige Schülerinnen und Schüler bei Klassenfahrten und finanziert Schulveranstaltungen.
        - list [ref=f5e87]:
          - listitem [ref=f5e88]:
            - link "Mehr erfahren" [ref=f5e89] [cursor=pointer]:
              - /url: sev.html
